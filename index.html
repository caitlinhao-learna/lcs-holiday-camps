<style>
/* Layout: a school exercise-book header (Seyès ruling, red margin), then a filter bar and a single column of provider cards. */
:root {
  --paper: #f8f9fe;
  --surface: #ffffff;
  --ink: #1b2140;
  --muted: #59618a;
  --rule: #cdd5f3;
  --rule-strong: #a9b6ec;
  --margin: #d9473c;
  --accent: #2a41b0;
  --accent-ink: #ffffff;
  --ok: #17704a;
  --ok-bg: #e3f4ec;
  --warn: #8f5600;
  --warn-bg: #fdf0db;
  --none: #646a8a;
  --none-bg: #eceef7;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11142a; --surface: #191d38; --ink: #e8ebf9; --muted: #a3aacb;
    --rule: #262d57; --rule-strong: #38427a; --margin: #ff786c; --accent: #94a5ff; --accent-ink: #11142a;
    --ok: #6fd8a4; --ok-bg: #173a2c; --warn: #f2b85c; --warn-bg: #3a2c15; --none: #9aa0bf; --none-bg: #23284a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11142a; --surface: #191d38; --ink: #e8ebf9; --muted: #a3aacb;
  --rule: #262d57; --rule-strong: #38427a; --margin: #ff786c; --accent: #94a5ff; --accent-ink: #11142a;
  --ok: #6fd8a4; --ok-bg: #173a2c; --warn: #f2b85c; --warn-bg: #3a2c15; --none: #9aa0bf; --none-bg: #23284a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Exercise-book header */
.cahier {
  border-bottom: 1px solid var(--rule-strong);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, transparent calc(max(16px, env(safe-area-inset-left, 0px)) + 34px), var(--margin) calc(max(16px, env(safe-area-inset-left, 0px)) + 34px), var(--margin) calc(max(16px, env(safe-area-inset-left, 0px)) + 36px), transparent calc(max(16px, env(safe-area-inset-left, 0px)) + 36px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
}
.cahier .wrap { padding-block: 28px 30px; }
.cahier-inner { padding-left: 52px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button {
  font: 600 14px/1 var(--font-body); color: var(--muted); background: transparent;
  border: 0; padding: 8px 14px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 6vw, 48px);
  line-height: 1.05; letter-spacing: -.02em; margin: 18px 0 10px; text-wrap: balance;
}
.lede { margin: 0; max-width: 60ch; color: var(--muted); font-size: 17px; }
.dates-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.day {
  font-variant-numeric: tabular-nums; text-align: center; min-width: 58px;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 6px 8px;
}
.day b { display: block; font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.day span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Filters */
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.filters .wrap { padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 15px/1 var(--font-body); border: 0; background: transparent; color: var(--ink); padding: 10px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
select {
  font: 600 15px var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 10px; padding: 8px 10px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.chip {
  font: 600 14px/1 var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* List */
main .wrap { padding-block: 20px 40px; }
.count { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
.list { display: grid; gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
  padding: 18px 18px 16px; display: grid; gap: 12px; min-width: 0;
}
.card.dim { background: transparent; }
.card-head { display: flex; justify-content: space-between; gap: 10px 16px; align-items: flex-start; flex-wrap: wrap; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
.cat { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.pill { font-size: 14px; font-weight: 700; border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
.pill.confirmed { color: var(--ok); background: var(--ok-bg); }
.pill.request, .pill.tbc { color: var(--warn); background: var(--warn-bg); }
.pill.none { color: var(--none); background: var(--none-bg); }
.when { font-weight: 700; font-size: 17px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.note { margin: 0; color: var(--muted); font-size: 15px; max-width: 70ch; }
.card-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; border-top: 1px dashed var(--rule-strong); padding-top: 12px; }
.contact { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; min-width: 0; }
.contact span { user-select: all; overflow-wrap: anywhere; }
.copy { font: 600 13px var(--font-body); color: var(--accent); background: none; border: 0; padding: 0 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.book {
  font: 700 15px/1 var(--font-body); color: var(--accent-ink); background: var(--accent);
  border-radius: 10px; padding: 11px 16px; text-decoration: none; white-space: nowrap;
}
.empty { border: 1px dashed var(--rule-strong); border-radius: 12px; padding: 24px; color: var(--muted); text-align: center; }
footer { border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
footer .wrap { padding-block: 20px 32px; display: grid; gap: 8px; }
footer p { margin: 0; max-width: 70ch; }
.disclaimer { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; margin-bottom: 6px; }
.disclaimer h2 { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); margin: 0; }
#disclaimer-body { display: grid; gap: 8px; }
.provider-cta a { color: var(--accent); font-weight: 700; }
@media (max-width: 520px) {
  .cahier-inner { padding-left: 44px; }
  .card { padding: 16px 14px 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s; }
  .card:hover { border-color: var(--rule-strong); }
}
</style>

<header class="cahier">

</header>

<nav class="filters" aria-label="Filters">

    </label>

  </div>
</nav>

<main>
  <div class="wrap">
    <p class="count" id="count" aria-live="polite"></p>
    <div class="list" id="list"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <section class="disclaimer" aria-labelledby="disclaimer-h">
      <h2 id="disclaimer-h" data-i18n="disclaimerTitle"></h2>
      <div id="disclaimer-body"></div>
    </section>

    <p class="provider-cta" id="provider-cta" hidden><span data-i18n="providerCta"></span> <a id="form-link" href="#" target="_blank" rel="noopener" data-i18n="providerLink"></a></p>

</footer>

      eyebrow: "Association des Parents et Amis · Lycée Condorcet Sydney",
      title: "Stages de vacances LCS",
      lede: "Stages et activités pour les familles du LCS pendant les vacances de novembre, alors que les écoles NSW sont en période scolaire et que peu de programmes sont proposés.",
      viewNov: "Vacances de novembre", viewAll: "Tous les prestataires",
      ageLabel: "Âge de l'enfant", anyAge: "Tous âges", years: " ans",
      cats: { all: "Toutes les activités", arts: "Arts plastiques", circus: "Cirque", language: "Langue française", sport: "Sport", water: "Voile et nautique", stem: "Construction et sciences" },
      status: { confirmed: "Confirmé pour le LCS", request: "Sur demande", tbc: "En attente de réponse", none: "Pas en novembre" },
      novPrefix: "Novembre : ",
      noNov: "Pas de dates en novembre",
      tbcDates: "Dates de novembre à confirmer",
      ages: "Âges", agesNone: "Non précisé", price: "Tarif", where: "Lieu", places: "Places",
      book: "Réserver ou se renseigner", copy: "Copier", copied: "Copié",
      count: function (n, v) { return n + (n === 1 ? " prestataire" : " prestataires") + (v === "nov" ? " pour les vacances de novembre" : " dans l'annuaire"); },
      empty: "Aucun prestataire ne correspond à ces filtres. Essayez un autre âge ou une autre activité.",
      footer: "Annuaire réalisé par l'Association des Parents et Amis du Lycée Condorcet Sydney. Les informations sont fournies par chaque prestataire.",
      disclaimerTitle: "Avertissement",
      disclaimer: [
        "Le LCS Holiday Activity Hub est une initiative gratuite, menée par des bénévoles, destinée à aider les familles à découvrir des activités et des programmes pendant les vacances scolaires.",
        "Toutes les informations sur les programmes sont transmises directement par les prestataires concernés. Bien que nous nous efforcions de tenir cet annuaire utile et à jour, nous ne vérifions pas de manière indépendante et ne garantissons pas l'exactitude des informations, ni la qualité, la sécurité, la disponibilité ou l'adéquation des programmes.",
        "Nous invitons les parents et tuteurs à effectuer leurs propres recherches et vérifications avant toute réservation, notamment les qualifications du prestataire, les modalités d'encadrement, l'assurance, les pratiques de protection de l'enfance, les tarifs et les conditions d'annulation.",
        "La présence d'un prestataire dans cet annuaire ne constitue ni une approbation ni une recommandation de la part des bénévoles, de l'Association des parents ou de l'école. Les réservations, paiements et modalités de participation sont convenus directement entre les familles et les prestataires."
      ],
      updated: "Dernière mise à jour : ",
      providerCta: "Vous proposez un programme de vacances ?", providerLink: "Inscrire votre stage",
      dow: ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."], month: "nov."
    }
  };

  var order = { confirmed: 0, request: 1, tbc: 2, none: 3 };
  var state = { lang: "en", view: "nov", age: "", cat: "all" };

  try {
    var saved = localStorage.getItem("lcs-lang");
    if (saved === "en" || saved === "fr") state.lang = saved;
    else if ((navigator.language || "").toLowerCase().indexOf("fr") === 0) state.lang = "fr";
  } catch (e) {}

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function L(v) { if (v == null) return null; return typeof v === "string" ? v : (v[state.lang] || v.en); }

  function copyText(btn, text) {
    var t = T[state.lang];
    function done() { btn.textContent = t.copied; setTimeout(function () { btn.textContent = t.copy; }, 1500); }
    try {
      navigator.clipboard.writeText(text).then(done, function () { selectSibling(btn); });
    } catch (e) { selectSibling(btn); }
  }
  function selectSibling(btn) {
    var span = btn.previousElementSibling;
    if (!span) return;
    var r = document.createRange(); r.selectNodeContents(span);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  function renderStatic() {
    var t = T[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = t[n.getAttribute("data-i18n")]; });
    document.getElementById("view-nov").textContent = t.viewNov;
    document.getElementById("view-all").textContent = t.viewAll;
    ["en", "fr"].forEach(function (l) { document.getElementById("lang-" + l).setAttribute("aria-pressed", String(state.lang === l)); });
    ["nov", "all"].forEach(function (v) { document.getElementById("view-" + v).setAttribute("aria-pressed", String(state.view === v)); });

    var strip = document.getElementById("dates-strip");
    strip.textContent = "";
    DATA.holiday.forEach(function (iso) {
      var d = new Date(iso + "T12:00:00");
      strip.appendChild(el("div", { cls: "day" }, [
        el("span", { text: t.dow[d.getDay()] }),
        el("b", { text: String(d.getDate()) }),
        el("span", { text: t.month })
      ]));
    });

    var sel = document.getElementById("age");
    sel.textContent = "";
    sel.appendChild(el("option", { value: "", text: t.anyAge }));
    for (var a = 3; a <= 17; a++) sel.appendChild(el("option", { value: String(a), text: a + t.years }));
    sel.value = state.age;

    var cats = ["all"];
    DATA.providers.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
    var chips = document.getElementById("chips");
    chips.textContent = "";
    cats.forEach(function (c) {
      var b = el("button", { type: "button", cls: "chip", id: "cat-" + c, "aria-pressed": String(state.cat === c), text: t.cats[c] || c });
      b.addEventListener("click", function () { state.cat = c; renderStatic(); renderList(); });
      chips.appendChild(b);
    });

    var d = new Date(DATA.updated + "T12:00:00");
    document.getElementById("updated").textContent = t.updated + d.toLocaleDateString(state.lang === "fr" ? "fr-FR" : "en-AU", { day: "numeric", month: "long", year: "numeric" });

    var db = document.getElementById("disclaimer-body");
    db.textContent = "";
    t.disclaimer.forEach(function (para) { db.appendChild(el("p", { text: para })); });

    var cta = document.getElementById("provider-cta");
    if (DATA.formUrl) { cta.hidden = false; document.getElementById("form-link").href = DATA.formUrl; }
    else cta.hidden = true;
  }

  function renderList() {
    var t = T[state.lang];
    var age = state.age === "" ? null : Number(state.age);
    var items = DATA.providers.filter(function (p) {
      if (state.view === "nov" && p.nov === "none") return false;
      if (state.cat !== "all" && p.cat !== state.cat) return false;
      if (age !== null && p.ageMin != null && (age < p.ageMin || age > p.ageMax)) return false;
      return true;
    }).sort(function (a, b) { return order[a.nov] - order[b.nov] || a.name.localeCompare(b.name); });

    document.getElementById("count").textContent = t.count(items.length, state.view);
    var list = document.getElementById("list");
    list.textContent = "";
    if (!items.length) { list.appendChild(el("div", { cls: "empty", text: t.empty })); return; }

    items.forEach(function (p) {
      var when = p.nov === "none" ? t.noNov : (p.novDates ? t.novPrefix + L(p.novDates) : t.tbcDates);
      var facts = el("dl", { cls: "facts" }, [
        el("div", null, [el("dt", { text: t.ages }), el("dd", { text: p.ageMin != null ? p.ageMin + "–" + p.ageMax + t.years : t.agesNone })]),
        el("div", null, [el("dt", { text: t.price }), el("dd", { text: L(p.price) || "–" })]),
        el("div", null, [el("dt", { text: t.where }), el("dd", { text: L(p.location) })]),
        p.places ? el("div", null, [el("dt", { text: t.places }), el("dd", { text: L(p.places) })]) : null
      ]);

      var contact = el("div", { cls: "contact" });
      if (p.email) {
        var em = el("span", { text: p.email });
        var cb = el("button", { type: "button", cls: "copy", text: t.copy, "aria-label": t.copy + " " + p.email });
        cb.addEventListener("click", function () { copyText(cb, p.email); });
        contact.appendChild(el("div", null, [em, document.createTextNode(" "), cb]));
      }
      if (p.phone) contact.appendChild(el("span", { text: p.phone }));

      var foot = el("div", { cls: "card-foot" }, [
        contact,
        p.url ? el("a", { cls: "book", href: p.url, target: "_blank", rel: "noopener", text: t.book }) : null
      ]);

      list.appendChild(el("article", { cls: "card" + (p.nov === "none" ? " dim" : "") }, [
        el("div", { cls: "card-head" }, [
          el("div", null, [el("h2", { text: p.name }), el("div", { cls: "cat", text: t.cats[p.cat] || p.cat })]),
          el("span", { cls: "pill " + p.nov, text: t.status[p.nov] })
        ]),
        el("div", { cls: "when", text: when }),
        facts,
        L(p.note) ? el("p", { cls: "note", text: L(p.note) }) : null,
        foot
      ]));
    });
  }

  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.getAttribute("data-lang");
      try { localStorage.setItem("lcs-lang", state.lang); } catch (e) {}
      renderStatic(); renderList();
    });
  });
  document.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { state.view = b.getAttribute("data-view"); renderStatic(); renderList(); });
  });
  document.getElementById("age").addEventListener("change", function (e) { state.age = e.target.value; renderList(); });

  renderStatic();
  renderList();
})();
</script>

</body>

</html>
